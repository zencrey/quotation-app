services:
  - type: web
    name: quotation-generator
    env: python
    region: frankfurt # or oregon, ohio, singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
